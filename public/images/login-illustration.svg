<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Data visualization elements -->
  <g opacity="0.9">
    <!-- Platform/base -->
    <rect x="150" y="400" width="500" height="20" rx="5" fill="white" opacity="0.8" />
    
    <!-- Devices and people -->
    <g transform="translate(180, 220)">
      <!-- Computer dashboard -->
      <rect x="0" y="0" width="120" height="80" rx="4" fill="white" stroke="#a5d8ff" stroke-width="2" />
      <rect x="10" y="10" width="100" height="60" rx="2" fill="#e7f5ff" />
      <rect x="20" y="20" width="80" height="10" rx="2" fill="#4dabf7" />
      <rect x="20" y="35" width="30" height="30" rx="2" fill="#339af0" />
      <rect x="55" y="35" width="45" height="30" rx="2" fill="#74c0fc" />
    </g>
    
    <g transform="translate(350, 150)">
      <!-- Mobile device -->
      <rect x="0" y="0" width="60" height="100" rx="8" fill="white" stroke="#a5d8ff" stroke-width="2" />
      <rect x="5" y="10" width="50" height="80" rx="2" fill="#e7f5ff" />
      <rect x="10" y="20" width="40" height="60" rx="2" fill="#4dabf7" />
      <circle cx="30" cy="90" r="5" fill="white" />
    </g>
    
    <!-- Cloud storage -->
    <g transform="translate(480, 230)">
      <path d="M50,20 C50,10 60,0 75,0 C90,0 100,10 100,20 C110,20 120,30 120,40 C120,50 110,60 100,60 L20,60 C10,60 0,50 0,40 C0,30 10,20 20,20 C20,10 30,0 40,0 C45,0 50,10 50,20" fill="white" stroke="#a5d8ff" stroke-width="2" />
      <circle cx="40" cy="30" r="10" fill="#4dabf7" />
      <circle cx="70" cy="30" r="10" fill="#339af0" />
      <circle cx="100" cy="30" r="10" fill="#74c0fc" />
    </g>
    
    <!-- Visual elements / charts -->
    <g transform="translate(200, 320)">
      <!-- Chart 1 -->
      <rect x="0" y="0" width="80" height="60" rx="4" fill="white" stroke="#a5d8ff" stroke-width="1" />
      <rect x="10" y="40" width="10" height="10" rx="1" fill="#4dabf7" />
      <rect x="25" y="30" width="10" height="20" rx="1" fill="#339af0" />
      <rect x="40" y="20" width="10" height="30" rx="1" fill="#74c0fc" />
      <rect x="55" y="10" width="10" height="40" rx="1" fill="#a5d8ff" />
    </g>
    
    <g transform="translate(450, 320)">
      <!-- Chart 2 -->
      <rect x="0" y="0" width="80" height="60" rx="4" fill="white" stroke="#a5d8ff" stroke-width="1" />
      <circle cx="40" cy="30" r="20" fill="none" stroke="#4dabf7" stroke-width="8" stroke-dasharray="75 25" />
      <circle cx="40" cy="30" r="20" fill="none" stroke="#339af0" stroke-width="8" stroke-dasharray="40 60" stroke-dashoffset="75" />
    </g>
    
    <!-- People -->
    <g transform="translate(300, 370)">
      <circle cx="20" cy="15" r="15" fill="white" />
      <circle cx="20" cy="10" r="7" fill="#4dabf7" />
      <rect x="5" y="20" width="30" height="20" rx="10" fill="#4dabf7" />
    </g>
    
    <g transform="translate(380, 340)">
      <circle cx="20" cy="15" r="15" fill="white" />
      <circle cx="20" cy="10" r="7" fill="#74c0fc" />
      <rect x="5" y="20" width="30" height="20" rx="10" fill="#74c0fc" />
    </g>
    
    <!-- Connecting lines -->
    <line x1="300" y1="250" x2="350" y2="200" stroke="white" stroke-width="2" stroke-dasharray="5,5" />
    <line x1="350" y1="250" x2="380" y2="230" stroke="white" stroke-width="2" stroke-dasharray="5,5" />
    <line x1="240" y1="300" x2="300" y2="250" stroke="white" stroke-width="2" stroke-dasharray="5,5" />
    <line x1="480" y1="280" x2="420" y2="300" stroke="white" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Floating icons -->
    <circle cx="270" cy="180" r="15" fill="white" opacity="0.8" />
    <rect x="265" y="175" width="10" height="10" rx="2" fill="#4dabf7" />
    
    <circle cx="450" cy="200" r="15" fill="white" opacity="0.8" />
    <text x="445" y="205" font-family="Arial" font-size="12" fill="#4dabf7">%</text>
    
    <circle cx="200" cy="250" r="15" fill="white" opacity="0.8" />
    <text x="195" y="255" font-family="Arial" font-size="12" fill="#4dabf7">$</text>
  </g>
  
  <!-- Background effects -->
  <circle cx="150" cy="150" r="50" fill="#74c0fc" opacity="0.2" />
  <circle cx="600" cy="300" r="70" fill="#74c0fc" opacity="0.2" />
  <circle cx="250" cy="450" r="40" fill="#74c0fc" opacity="0.3" />
</svg>
