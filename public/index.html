<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to 1Channel</title>
  <meta http-equiv="refresh" content="0; URL=/">
  <link rel="canonical" href="/">
  <style>
    body {
      font-family: urbanist, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
    .redirect-container {
      text-align: center;
      padding: 2rem;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="redirect-container">
    <h2>Redirecting to 1Channel Application</h2>
    <div class="loader"></div>
    <p>If you are not redirected automatically, click <a href="/">here</a>.</p>
  </div>
  <script>
    // Immediate redirect
    window.location.href = "/";
    
    // Fallback redirect after a short delay
    setTimeout(function() {
      if (window.location.pathname === '/index.html') {
        window.location.href = "/";
      }
    }, 1000);
  </script>
</body>
</html>
